apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: {{ .Values.postgres.storage.type }}
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Release.Namespace }}-{{ .Release.Name }}-gp3
  resources:
    requests:
      storage: {{ .Values.postgres.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.config.POSTGRES_HOST }}
spec:
  selector:
    app: {{ .Release.Name }}-postgres
  ports:
    - name: postgres
      port: {{ .Values.config.POSTGRES_PORT }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-p", {{ .Values.config.POSTGRES_PORT | toString | quote }}]
          ports:
            - name: postgres
              containerPort: {{ .Values.config.POSTGRES_PORT }}
          env:
            {{- range $key := list "POSTGRES_DB" "POSTGRES_USER" "POSTGRES_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Release.Name }}-config
                  key: {{ $key }}
            {{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -p {{ .Values.config.POSTGRES_PORT }} -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-postgres
